<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#ececec;
}

.dashboard{
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:250px;
background:#d8d8d8;
padding:20px;
}

.logo{
text-align:center;
font-size:24px;
font-weight:bold;
color:#135b59;
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
padding:15px;
background:white;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.sidebar li:hover,
.active{
background:#146f6a;
color:white;
}

/* MAIN */

main{
flex:1;
padding:20px;
}

h1{
color:#135b59;
margin-bottom:20px;
}

.top-cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card h3{
margin-bottom:10px;
}

.card span{
font-size:35px;
font-weight:bold;
color:#146f6a;
}

.panel{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.search-box{
width:100%;
padding:12px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:8px;
}

table{
width:100%;
border-collapse:collapse;
}

table th{
background:#146f6a;
color:white;
padding:12px;
}

table td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

.delete-btn{
background:red;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

.delete-btn:hover{
background:darkred;
}

@media(max-width:900px){

.dashboard{
flex-direction:column;
}

.sidebar{
width:100%;
}

.top-cards{
grid-template-columns:1fr;
}


                   /* for the AI chatbot */
                 /* Floating Button */

                 #chatButton{

                     position:fixed;
                     bottom:25px;
                     right:25px;

                     width:65px;
                     height:65px;

                     background:#0f4c5c;
                     color:white;

                     border-radius:50%;

                     display:flex;
                     justify-content:center;
                     align-items:center;

                     font-size:30px;

                     cursor:pointer;

                     box-shadow:0 5px 20px rgba(0,0,0,.3);

                     z-index:999;

                 }

                 #chatButton:hover{

                     background:#118A8C;

                 }

                   /* Chat Window */

                 #chatWindow{

                     position:fixed;

                     bottom:100px;
                     right:25px;

                     width:360px;
                     height:520px;

                     background:white;

                     border-radius:15px;

                     display:none;

                     flex-direction:column;

                     overflow:hidden;

                     box-shadow:0 8px 30px rgba(0,0,0,.25);

                     z-index:999;

                 }

                 /* Header */

                 #chatHeader{

                     background:#0f4c5c;

                     color:white;

                     padding:15px;

                     display:flex;

                     justify-content:space-between;

                     align-items:center;

                     font-weight:bold;

                 }

                 #chatHeader button{

                     background:none;

                     border:none;

                     color:white;

                     font-size:18px;

                     cursor:pointer;

                 }

                   /* Messages */

                 #chatMessages{

                     flex:1;

                     padding:15px;

                     overflow-y:auto;

                     background:#f6f6f6;

                 }

                 .user{

                     background:#118A8C;

                     color:white;

                     padding:10px;

                     margin:8px 0;

                     border-radius:12px;

                     width:fit-content;

                     margin-left:auto;

                     max-width:80%;

                 }

                 .bot{

                     background:#e2e2e2;

                     padding:10px;

                     margin:8px 0;

                     border-radius:12px;                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 

                     max-width:80%;

                 }

                    /* Input */

                 #chatInputArea{

                     display:flex;

                     padding:10px;

                     background:white;

                 }

                 #chatInputArea input{

                     flex:1;

                     padding:10px;

                     border:1px solid #ccc;

                     border-radius:8px;

                 }

                 #chatInputArea button{

                     margin-left:10px;

                     background:#0f4c5c;

                     color:white;

                     border:none;

                     padding:10px 15px;

                     border-radius:8px;

                     cursor:pointer;

                 }

                 #chatInputArea button:hover{

                     background:#118A8C;

                 }

}

</style>
</head>

   <script>
             const responses = [

                 {
                     keywords:["hello","hi","hey"],
                     reply:"👋 Hello! Welcome to DormDesk. How can I help you today?"
                 },

                 {
                     keywords:["how are you doing","I am fine","I am good thanks and you"],
                     reply:"👋 I am also good thanks. How can I help you today?"
                 },

                 {
                     keywords:["wifi","internet"],
                     reply:"📶 If your Wi-Fi is not working, submit a report under Network Issues."
                 },

                 {
                     keywords:["water","hot water"],
                     reply:"🚿 Please report hot water or plumbing problems under Plumbing."
                 },

                 {
                     keywords:["electricity","power"],
                     reply:"💡 Report electricity problems under Electrical Issues."
                 },

                 {
                     keywords:["room"],
                     reply:"🏠 Please include your Block and Room Number when submitting a report."
                 },

                 {
                     keywords:["report"],
                     reply:"📝 Go to Report Issue, choose a category, describe the problem and click Submit."
                 },

                 {
                     keywords:["track"],
                     reply:"📄 You can track your reports from the 'My Reports' page."
                 },

                 {
                     keywords:["password"],
                     reply:"🔑 If you forgot your password, use the Forgot Password option or contact the administrator."
                 },

                 {
                     keywords:["security"],
                     reply:"🚨 For emergencies, contact Residence Security immediately or use the SOS feature."
                 },

                 {
                     keywords:["laundry"],
                     reply:"🧺 The laundry room is located on the ground floor."
                 },

                 {
                     keywords:["study room"],
                     reply:"📚 The study room is open 24 hours for registered students."
                 },

                 {
                     keywords:["admin"],
                     reply:"👨‍💼 You can contact the residence administrator during office hours."
                 },

                 {
                     keywords:["thank","thanks"],
                     reply:"😊 You're welcome!"
                 },

                 {
                     keywords:["bye"],
                     reply:"👋 Goodbye! Have a wonderful day."
                 }

             ];

             function toggleChat(){

                 const chat=document.getElementById("chatWindow");

                 if(chat.style.display==="flex"){

                     chat.style.display="none";

                 }else{

                     chat.style.display="flex";

                     if(document.getElementById("chatMessages").innerHTML===""){

                         addBotMessage("👋 Hello! I'm the timbev@ chatBot Assistant. Ask me anything about the residence.");

                     }
 
                 }

             }

             function handleKey(e){

                 if(e.key==="Enter"){

                     sendMessage();

                 }

             }

             function sendMessage(){

                 const input=document.getElementById("userInput");

                 const message=input.value.trim();

                 if(message==="") return;

                 addUserMessage(message);

                 input.value="";

                 let reply="🤖 Sorry, I don't understand that. Please contact the residence office for assistance.";

                 const lower=message.toLowerCase();
                //   loop through the responses array to find a matching keyword
                 for(let item of responses){

                     for(let keyword of item.keywords){

                         if(lower.includes(keyword)){

                             reply=item.reply;

                             break;

                         }

                     }

                     if(reply===item.reply) break;

                 }

                 setTimeout(()=>{

                     addBotMessage(reply);

                 },500);

             }

             function addUserMessage(text){

                 const messages=document.getElementById("chatMessages");

                 messages.innerHTML+=`<div class="user">${text}</div>`;

                 messages.scrollTop=messages.scrollHeight;

             }

             function addBotMessage(text){

                 const messages=document.getElementById("chatMessages");

                 messages.innerHTML+=`<div class="bot">${text}</div>`;

                 messages.scrollTop=messages.scrollHeight;

             }
         </script>


<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            DormDesk Admin
        </div>

        <ul>

             <li onclick="GoToADMINCONTENT()">
                 <i class="fa-solid fa-chart-line"></i>
                 Dashboard
             </li>
             <li onclick="goToUPDATEreport()">
                 <i class="fa-solid fa-screwdriver-wrench"></i>
                  Maintenance Requests
             </li>

             <li onclick = "GoToADMINSTUDENTS()">
                 <i class="fa-solid fa-users"></i>
                 Students
             </li>
            <li onclick="GoToProfileADMIN()">
                 <i class="fa-solid fa-user"></i>
                 Profile
                 </a>
            </li>

             <li onclick="logout()">
                 <i class="fa-solid fa-right-from-bracket"></i>
                 Logout
             </li>

        </ul>

    </aside>

    <!-- MAIN -->

    <main>

        <h1>WELCOME ADMIN</h1>

        <!-- CARDS -->

        <div class="top-cards">

            <div class="card">
                <h3>Total Students</h3>
                <span id="totalStudents">0</span>
            </div>

            <div class="card">
                <h3>Active Alerts</h3>
                <span>0</span>
            </div>

            <div class="card">
                <h3>Open Requests</h3>
                <span>0</span>
            </div>

        </div>

        <!-- STUDENTS PANEL -->

        <div class="panel">

            <h2>Registered Students</h2>

            <br>

            <input
                type="text"
                id="searchStudent"
                class="search-box"
                placeholder="Search Student..."
                onkeyup="searchStudent()">

            <table>

                <thead>

                    <tr>

                        <th>Student No</th>
                        <th>Full Name</th>
                        <th>Block</th>
                        <th>Gender</th>
                        <th>Email</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </main>

</div>

<!-- Chat Button -->
<div id="chatButton" onclick="toggleChat()">
    💬
</div>

<!-- Chat Window -->
<div id="chatWindow">

    <div id="chatHeader">
        <span>🤖 DormDesk Bot</span>
        <button onclick="toggleChat()">✖</button>
    </div>

    <div id="chatMessages"></div>

    <div id="chatInputArea">

        <input
            type="text"
            id="userInput"
            placeholder="Ask me anything..."
            onkeypress="handleKey(event)"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

</body>

<script>
    
     function GoToADMINCONTENT(){
         window.location.href = "INDEX.ADMINCONTENT.html";
     }
     function logout(){
         window.location.href="INDEX.ADMINLOGIN.html";
     }
     function GoToADMINSTUDENTS(){
        window.location.href = "INDEX.ADMINSTUDENTS.html";
     }
     function GoToProfileADMIN(){
         window.location.href = "INDEX.ADMINPROFILE.html";
     }
     function goToUPDATEreport(){
        window.location.href="INDEX.ADMINUPDATEREPORT.html";
     } 

window.onload = loadStudents;

async function loadStudents(){

    try{

        const response = await fetch(
            "http://localhost:3000/api/students"
        );

        const students = await response.json();

        const table =
        document.getElementById("studentTable");

        table.innerHTML = "";

        document.getElementById(
            "totalStudents"
        ).innerText = students.length;

        students.forEach(student => {

            table.innerHTML += `
                <tr>
                    <td>${student.studentNumber}</td>
                    <td>${student.fullname}</td>
                    <td>${student.block}</td>
                    <td>${student.gender}</td>
                    <td>${student.emailAddress}</td>
                    <td>
                        <button
                            class="delete-btn"
                            onclick="deleteStudent('${student.studentNumber}')">
                            Delete
                        </button>
                    </td>
                </tr>
            `;

        });

    }
    catch(error){

        console.error(error);

    }

}
// DELETING STUDENTS
async function deleteStudent(studentNumber){

    const confirmDelete = confirm(
        "Are you sure you want to delete this student?"
    );

    if(!confirmDelete){
        return;
    }

    try{

        const response = await fetch(
            `http://localhost:3000/api/students/${studentNumber}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        alert(data.message);

        loadStudents();

    }
    catch(error){

        console.error(error);

        alert("Failed to delete student");

    }

}
</script>
</html>
