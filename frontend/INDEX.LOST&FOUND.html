<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DormDesk Lost & Found</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ececec;
}

.dashboard{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:230px;
    background:#d8d8d8;
    padding:20px;
    box-shadow:3px 0 10px rgba(0,0,0,.1);
}

.top-header{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:25px;
    padding-bottom:20px;
    border-bottom:1px solid #ccc;
}

.logo-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.logo-img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:12px;
    border:3px solid #146f6a;
}

.logo-container h1{
    color:#146f6a;
}

.header-icons{
    margin-top:15px;
    display:flex;
    gap:20px;
}

.notification,
.profile{
    position:relative;
    color:#146f6a;
    font-size:28px;
    cursor:pointer;
}

.badge{
    position:absolute;
    top:-8px;
    right:-10px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:red;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.sidebar li i{
    margin-right:10px;
    color:#146f6a;
}

.sidebar li:hover{
    background:#146f6a;
    color:white;
}

.sidebar li:hover i{
    color:white;
}

.active{
    background:#146f6a !important;
    color:white;
}

.active i{
    color:white !important;
}

/* MAIN CONTENT */

.content{
    flex:1;
    padding:30px;
}

.hero{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.hero h1{
    color:#146f6a;
    margin-bottom:10px;
}

.layout{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:20px;
}

.post-box,
.feed{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.post-box h2{
    color:#146f6a;
    margin-bottom:15px;
}

.post-box input,
.post-box textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
}

.post-box textarea{
    min-height:120px;
}

.post-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#146f6a;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.post-btn:hover{
    background:#0f5a56;
}

.preview{
    width:100%;
    border-radius:10px;
    margin-bottom:10px;
    display:none;
}

.search-box input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:15px;
}

.post-card{
    background:#fff;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.post-image{
    width:100%;
    max-height:250px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:10px;
}

.post-title{
    font-size:20px;
    font-weight:bold;
    color:#146f6a;
    margin-bottom:10px;
}

.post-description{
    margin-bottom:10px;
}

.post-footer{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:14px;
    color:#666;
}

.comments{
    margin-top:15px;
}

.comment{
    background:#ececec;
    padding:8px;
    border-radius:6px;
    margin-top:8px;
}

.comment-input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:6px;
    border:1px solid #ddd;
}

.comment-btn{
    margin-top:10px;
    padding:10px 15px;
    background:#146f6a;
    border:none;
    border-radius:6px;
    color:white;
    cursor:pointer;
}

/* for the AI chatbot */
                 /* Floating Button */

                 #chatButton{

                     position:fixed;
                     bottom:25px;
                     right:25px;

                     width:65px;
                     height:65px;

                     background:#0f4c5c;
                     color:white;

                     border-radius:50%;

                     display:flex;
                     justify-content:center;
                     align-items:center;

                     font-size:30px;

                     cursor:pointer;

                     box-shadow:0 5px 20px rgba(0,0,0,.3);

                     z-index:999;

                 }

                 #chatButton:hover{

                     background:#118A8C;

                 }

                   /* Chat Window */

                 #chatWindow{

                     position:fixed;

                     bottom:100px;
                     right:25px;

                     width:360px;
                     height:520px;

                     background:white;

                     border-radius:15px;

                     display:none;

                     flex-direction:column;

                     overflow:hidden;

                     box-shadow:0 8px 30px rgba(0,0,0,.25);

                     z-index:999;

                 }

                 /* Header */

                 #chatHeader{

                     background:#0f4c5c;

                     color:white;

                     padding:15px;

                     display:flex;

                     justify-content:space-between;

                     align-items:center;

                     font-weight:bold;

                 }

                 #chatHeader button{

                     background:none;

                     border:none;

                     color:white;

                     font-size:18px;

                     cursor:pointer;

                 }

                   /* Messages */

                 #chatMessages{

                     flex:1;

                     padding:15px;

                     overflow-y:auto;

                     background:#f6f6f6;

                 }

                 .user{

                     background:#118A8C;

                     color:white;

                     padding:10px;

                     margin:8px 0;

                     border-radius:12px;

                     width:fit-content;

                     margin-left:auto;

                     max-width:80%;

                 }

                 .bot{

                     background:#e2e2e2;

                     padding:10px;

                     margin:8px 0;

                     border-radius:12px;                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 

                     max-width:80%;

                 }

                    /* Input */

                 #chatInputArea{

                     display:flex;

                     padding:10px;

                     background:white;

                 }

                 #chatInputArea input{

                     flex:1;

                     padding:10px;

                     border:1px solid #ccc;

                     border-radius:8px;

                 }

                 #chatInputArea button{

                     margin-left:10px;

                     background:#0f4c5c;

                     color:white;

                     border:none;

                     padding:10px 15px;

                     border-radius:8px;

                     cursor:pointer;

                 }

                 #chatInputArea button:hover{

                     background:#118A8C;

                 }

@media(max-width:900px){

    .dashboard{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
    }

    .layout{
        grid-template-columns:1fr;
    }

}

</style>
</head>

 <!-- Script for AI chatbot -->

         <script>
             const responses = [

                 {
                     keywords:["hello","hi","hey"],
                     reply:"👋 Hello! Welcome to DormDesk. How can I help you today?"
                 },

                 {
                     keywords:["how are you doing","I am fine","I am good thanks and you"],
                     reply:"👋 I am also good thanks. How can I help you today?"
                 },

                 {
                     keywords:["wifi","internet"],
                     reply:"📶 If your Wi-Fi is not working, submit a report under Network Issues."
                 },

                 {
                     keywords:["water","hot water"],
                     reply:"🚿 Please report hot water or plumbing problems under Plumbing."
                 },

                 {
                     keywords:["electricity","power"],
                     reply:"💡 Report electricity problems under Electrical Issues."
                 },

                 {
                     keywords:["room"],
                     reply:"🏠 Please include your Block and Room Number when submitting a report."
                 },

                 {
                     keywords:["report"],
                     reply:"📝 Go to Report Issue, choose a category, describe the problem and click Submit."
                 },

                 {
                     keywords:["track"],
                     reply:"📄 You can track your reports from the 'My Reports' page."
                 },

                 {
                     keywords:["password"],
                     reply:"🔑 If you forgot your password, use the Forgot Password option or contact the administrator."
                 },

                 {
                     keywords:["security"],
                     reply:"🚨 For emergencies, contact Residence Security immediately or use the SOS feature."
                 },

                 {
                     keywords:["laundry"],
                     reply:"🧺 The laundry room is located on the ground floor."
                 },

                 {
                     keywords:["study room"],
                     reply:"📚 The study room is open 24 hours for registered students."
                 },

                 {
                     keywords:["admin"],
                     reply:"👨‍💼 You can contact the residence administrator during office hours."
                 },

                 {
                     keywords:["thank","thanks"],
                     reply:"😊 You're welcome!"
                 },

                 {
                     keywords:["bye"],
                     reply:"👋 Goodbye! Have a wonderful day."
                 }

             ];

             function toggleChat(){

                 const chat=document.getElementById("chatWindow");

                 if(chat.style.display==="flex"){

                     chat.style.display="none";

                 }else{

                     chat.style.display="flex";

                     if(document.getElementById("chatMessages").innerHTML===""){

                         addBotMessage("👋 Hello! I'm the timbev@ chatBot Assistant. Ask me anything about the residence.");

                     }
 
                 }

             }

             function handleKey(e){

                 if(e.key==="Enter"){

                     sendMessage();

                 }

             }

             function sendMessage(){

                 const input=document.getElementById("userInput");

                 const message=input.value.trim();

                 if(message==="") return;

                 addUserMessage(message);

                 input.value="";

                 let reply="🤖 Sorry, I don't understand that. Please contact the residence office for assistance.";

                 const lower=message.toLowerCase();
                //   loop through the responses array to find a matching keyword
                 for(let item of responses){

                     for(let keyword of item.keywords){

                         if(lower.includes(keyword)){

                             reply=item.reply;

                             break;

                         }

                     }

                     if(reply===item.reply) break;

                 }

                 setTimeout(()=>{

                     addBotMessage(reply);

                 },500);

             }

             function addUserMessage(text){

                 const messages=document.getElementById("chatMessages");

                 messages.innerHTML+=`<div class="user">${text}</div>`;

                 messages.scrollTop=messages.scrollHeight;

             }

             function addBotMessage(text){

                 const messages=document.getElementById("chatMessages");

                 messages.innerHTML+=`<div class="bot">${text}</div>`;

                 messages.scrollTop=messages.scrollHeight;

             }
         </script>


<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="top-header">

  <div class="logo-container">

    <img
    src="https://media.licdn.com/dms/image/v2/D4D22AQFFEYM5TCBrfA/feedshare-shrink_480/B4DZ9XL5JhJAAk-/0/1783874163525?e=1789603200&v=beta&t=4u6vgkskEd-vlONXCwY0qrsf6WOVDqbWYnG61dECScY"
    alt="DormDesk Logo"
    class="logo-img">

    <h1>DormDesk</h1>

</div>

            <!-- <div class="header-icons">

                <div class="notification">
                    <i class="fa-solid fa-bell"></i>
                    <span class="badge">3</span>
                </div>

                <div class="profile">
                    <i class="fa-solid fa-user-circle"></i>
                </div>

            </div> -->

        </div>

        <ul>

            <li onclick="GoToDashboard()">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </li>

            <li onclick="GoToMarketPlace()">
                <i class="fa-solid fa-store"></i>
                Marketplace
            </li>

            <li class="active" onclick="GoToLostFound()">
                <i class="fa-solid fa-key"></i>
                Lost &amp; Found
            </li>

            <li onclick="GoToUpdates()">
                <i class="fa-solid fa-bell"></i>
                Updates
            </li>

            <li onclick="GoToReportIssues()">
                <i class="fa-solid fa-circle-exclamation"></i>
                Report Issues
            </li>

            <li onclick="LogOut()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Log Out
            </li>

        </ul>

    </aside>

    <main class="content">

        <div class="hero">
            <h1>Lost Something?</h1>
            <p>Post missing items or help residents reunite with their belongings.</p>
        </div>

        <div class="layout">

            <div class="post-box">

                <h2>
                    <i class="fa-solid fa-circle-plus"></i>
                    Report Item
                </h2>

                <input type="text" id="itemTitle" placeholder="Item Name">

                <textarea
                    id="itemDescription"
                    placeholder="Describe the item and where it was lost/found"></textarea>

                <input title="image"
                    type="file"
                    id="itemImage"
                    accept="image/*">

                <img id="preview" class="preview">

                <button class="post-btn" id="postBtn">
                    Publish Report
                </button>

            </div>

            <div class="feed">

                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search Lost & Found">
                </div>

                <div id="posts"></div>

            </div>

        </div>

    </main>

</div>

<!-- Chat Button -->
             <div id="chatButton" onclick="toggleChat()">
                 💬
             </div>

             <!-- Chat Window -->
             <div id="chatWindow">

                 <div id="chatHeader">
                     <span>🤖 timbev@ Bot</span>
                     <button onclick="toggleChat()">✖</button>
                 </div>

                 <div id="chatMessages"></div>

                 <div id="chatInputArea">

                     <input
                         type="text"
                         id="userInput"
                         placeholder="Ask me anything..."
                         onkeypress="handleKey(event)">

                     <button onclick="sendMessage()">Send</button>

                 </div>

             </div>

<script>

const imageInput =
document.getElementById("itemImage");

const preview =
document.getElementById("preview");


imageInput.addEventListener("change",(e)=>{

const file = e.target.files[0];

if(file){

preview.src = URL.createObjectURL(file);
preview.style.display = "block";

}

});


document
.getElementById("postBtn")
.addEventListener("click",()=>{

const title =
document.getElementById("itemTitle").value;

const description =
document.getElementById("itemDescription").value;

const image =
preview.src;

if(!title || !description){

alert("Please complete all fields");
return;

}

addPost({
title,
description,
image,
date:new Date().toLocaleDateString()
});

document.getElementById("itemTitle").value="";
document.getElementById("itemDescription").value="";
document.getElementById("itemImage").value="";
preview.style.display="none";

/*

=========================
SAVE TO DATABASE HERE
=========================

saveLostFoundPost(data)

*/

});


function addPost(post){

const container =
document.getElementById("posts");

const postCard =
document.createElement("div");

postCard.className = "post-card";

postCard.innerHTML = `

${post.image}

<div class="post-content">

<div class="post-title">
${post.title}
</div>

<div class="post-description">
${post.description}
</div>

<div class="post-footer">

<span>${post.date}</span>

<span class="badge">
Lost & Found
</span>

</div>

<div class="comments">

<h4>Comments</h4>

<div class="comment-list"></div>

<input
type="text"
class="comment-input"
placeholder="Write a comment...">

<button class="comment-btn">
Post Comment
</button>

</div>

</div>

`;

const commentBtn =
postCard.querySelector(".comment-btn");

const commentInput =
postCard.querySelector(".comment-input");

const commentList =
postCard.querySelector(".comment-list");

commentBtn.addEventListener("click",()=>{

if(commentInput.value.trim() === "")
return;

const comment =
document.createElement("div");

comment.className = "comment";

comment.textContent =
commentInput.value;

commentList.appendChild(comment);

commentInput.value = "";

/*

=========================
SAVE COMMENT TO DATABASE
=========================

saveComment()

*/

});

container.prepend(postCard);

}


document
.getElementById("searchInput")
.addEventListener("keyup",function(){

const value =
this.value.toLowerCase();

const posts =
document.querySelectorAll(".post-card");

posts.forEach(post=>{

const text =
post.innerText.toLowerCase();

post.style.display =
text.includes(value)
? "block"
: "none";

});

});


/*

addPost(post);

    function GoToEmergency() {
        window.location.href = "INDEX.EMERGENCY.html";
    }
    function GoToLostFound() {
        window.location.href = "INDEX.LOST&FOUND.html";
    }
    function GoToUpdates(){
        window.location.href="INDEX.UPDATES.html";
    }
    function GoToReportIssues(){
        window.location.href="INDEX.REPORTISSUES.html";
    }
    function GoToMarketPlace(){
        window.location.href="INDEX.market.html";
    }
    function GoToDashboard(){
        window.location.href="INDEX.DASHBOARD.html";
    }
</script>


</body>
</html>
