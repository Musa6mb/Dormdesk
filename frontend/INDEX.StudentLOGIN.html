             <style>

                     width:100%;

                     justify-content:space-between;
                     align-items:center;

                 .logo{

                 .logo img{

                     border-radius:50%;

                     background:white;
                 }
                 .logo-container h1{

                 }

                 .left{

                     background:#e6efee;
                     padding:40px;
                     display:flex;
                     flex-direction:column;
                     justify-content:center;
                 }

                 .left h1{
                     font-size:34px;
                     color:#1f4d4c;
                     margin-bottom:10px;
                 }

                 .left p{
                     color:#4b6b6b;
                 }

                 .right{
                     width:50%;
                     background:white;
                     padding:40px;
                     display:flex;
                     flex-direction:column;
                     justify-content:center;
                 }

                 .right h2{
                     font-size:26px;
                     color:#1f4d4c;
                     margin-bottom:5px;
                 }

                 .subtitle{
                     font-size:14px;
                     color:#666;
                     margin-bottom:20px;
                 }

                 .input-group{
                     margin-bottom:15px;
                 }

                 input{
                     width:100%;
                     padding:12px;
                     border-radius:8px;
                     border:1px solid #ccc;
                 }

                 input:focus{
                     border-color:#1f6f6d;
                     outline:none;
                 }

                 .login-btn{
                     width:100%;
                     padding:12px;
                     background:#1f6f6d;
                     color:white;
                     border:none;
                     border-radius:8px;
                     font-weight:bold;
                     cursor:pointer;
                 }

                 .login-btn:hover{
                     background:#155a58;
                 }

                 .register{

                     margin-top:15px;
                 }

                 .register a{
                     text-decoration:none;
                     color:#1f6f6d;
                 }

                 #message{
                     margin-top:15px;

                     text-align:center;
                 }

                 } */

                     text-decoration:none;
                     color:#1f6f6d;

         <body>
             <header>

                 <div class="logo">
                     <img src ="https://media.licdn.com/dms/image/v2/D4D22AQFFEYM5TCBrfA/feedshare-shrink_800/B4DZ9XL5JhJAAg-/0/1783874163524?e=1793232000&v=beta&t=4VQEIzGHz869lh6hcS_Oli43YuD9uS1R39rXvNjmP8E" alt="dorm desk">
                     <h1>DormDesk</h1>
                 </div>

                 <!-- <button id="themeToggle" class="theme-btn">
                     🌙 Dark
                 </button> -->

                 <div class="home-btn" id="home">
                     <button class="home-btn" onclick="window.location.href='INDEX.LANDINGPAGE.html'">
                         Home
                     </button>
                 </div>

             </header>

             <div class="main-content">

                 <div class="container">
                     <div class="left">
                         <img src="https://media.licdn.com/dms/image/v2/D4D22AQFFEYM5TCBrfA/feedshare-shrink_800/B4DZ9XL5JhJAAg-/0/1783874163524?e=1793232000&v=beta&t=4VQEIzGHz869lh6hcS_Oli43YuD9uS1R39rXvNjmP8E" alt="Dorm Desk">
                         <h1>Dorm Desk</h1>
                         <p>Your campus. Your community.<br>We're here to help.</p>
                     </div>

                     <div class="right">
                         <h2>Student Login</h2>
                         <p class="subtitle">Login using your Student Number.</p>

                         <div class="input-group">
                             <input
                                 type="text"
                                 id="studentNumber"
                                 placeholder="Student Number">
                         </div>

                         <div class="input-group">
                             <input
                                 type="password"
                                 id="password"
                                 placeholder="Password"
                                 required>
                         </div>

                         <button class="login-btn"onclick="studentLogin()">Log In</button>

                         <div class="register">
                             Don't have an account?
                             <a href="INDEX.StudentREG.html">
                                 Sign Up
                             </a>            
                         </div>
                         <div class = "forgetpassword">
                             <a href="INDEX.fogertPassSTUD.html">forget password</a>
                         </div>

                         <p id="message"></p>

                     </div>

                 </div>
             </div>

             <footer>
                 <p>
                     &copy; 2026 Dorm Desk App.All rights reseved.
                 </p>
             </footer>


             <script>
                async function studentLogin() {

    const studentNumber =
    document.getElementById("studentNumber").value;

    const password =
    document.getElementById("password").value;

    const response = await fetch(
        "http://localhost:3000/api/students/login",
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                studentNumber,
                password
            })
        }
    );

    const data = await response.json();

    if(response.ok){

    localStorage.setItem(
        "loggedInStudent",
        JSON.stringify(data.student)
    );

    localStorage.setItem(
        "studentNumber",
        data.student.studentNumber
    );

    window.location.href =
    "INDEX.DASHBOARD.html";

} else {

        document.getElementById("message")
        .innerHTML = data.message;
    }
}
             </script>
